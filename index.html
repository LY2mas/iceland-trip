<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冰島環島｜最終確認版</title>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root { --bg:#FFFCF6; --ink:#3E3A39; --coral:#F2A497; --yellow:#F6D27A; --blue:#A8D3E6; --green:#B9DAA5; --radius:28px; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:'Huninn',sans-serif; line-height:1.6; padding-top:72px; }
nav { position:fixed; top:0; left:0; right:0; background:var(--bg); border-bottom:3px solid var(--ink); z-index:100; display:flex; justify-content:center; gap:8px; padding:12px 16px; flex-wrap:wrap; }
nav a { text-decoration:none; color:var(--ink); background:var(--yellow); border:3px solid var(--ink); border-radius:999px; padding:8px 18px; }
nav a.active { background:var(--coral); }
.container { max-width:960px; margin:0 auto; padding:20px; }
.card { background:var(--bg); border:3px solid var(--ink); border-radius:var(--radius); padding:20px; margin:16px 0; }
.hero { text-align:center; padding:30px 20px; }
.hero h1 { font-size:2.6rem; }
.countdown { font-size:1.5rem; background:var(--coral); border:3px solid var(--ink); border-radius:var(--radius); display:inline-block; padding:12px 24px; margin-top:12px; }
.day-switcher { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:20px; }
.day-btn { border:3px solid var(--ink); border-radius:999px; padding:10px 16px; cursor:pointer; font-family:inherit; color:#3E3A39; }
.day-btn.active { background:var(--coral)!important; }
.timeline { position:relative; padding-left:30px; }
.timeline::before { content:''; position:absolute; left:10px; top:0; bottom:0; width:4px; background:var(--ink); border-radius:2px; }
.item { background:var(--bg); border:3px solid var(--ink); border-radius:20px; padding:14px 16px; margin:12px 0; position:relative; }
.item::before { content:''; position:absolute; left:-26px; top:18px; width:14px; height:14px; background:var(--green); border:3px solid var(--ink); border-radius:50%; }
.stay-box { background:var(--blue); border:3px solid var(--ink); border-radius:20px; padding:16px; margin:18px 0 8px; }
.tag { display:inline-block; padding:2px 10px; border:2px solid var(--ink); border-radius:999px; font-size:0.8rem; margin-right:6px; }
.tag-drive { background:var(--yellow); } .tag-walk { background:var(--green); } .tag-act { background:var(--coral); } .tag-eat { background:var(--blue); }
.must { background:var(--coral); border:2px solid var(--ink); border-radius:8px; padding:1px 8px; font-size:0.8rem; margin-left:6px; }
.toll { background:#FF6B6B; border:2px solid var(--ink); border-radius:8px; padding:1px 8px; font-size:0.8rem; margin-left:6px; font-weight:bold; }
.note { background:var(--yellow); border:2px solid var(--ink); border-radius:8px; padding:1px 8px; font-size:0.8rem; margin-left:6px; }
.cap { font-size:0.85rem; margin-top:4px; }
.spot-img,.hero-img,.stay-img,.shop-img { width:100%; max-width:520px; border-radius:16px; border:3px solid var(--ink); margin:8px 0; display:block; }
.checklist li { list-style:none; margin:10px 0; display:flex; align-items:center; gap:10px; }
.shop-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
.shop-item { background:var(--bg); border:3px solid var(--ink); border-radius:20px; padding:14px; }
</style>
<!-- force-pages-rebuild -->
</head>
<body>
<nav>
  <a href="index.html">首頁</a>
  <a href="index.html#flights">航班</a>
  <a href="index.html#itinerary">每日行程</a>
  <a href="shopping.html">購物</a>
</nav>
<div class="container">
  <section id="hero" class="hero">
    <img class="hero-img" src="images/blue-lagoon.jpg" alt="藍湖">
    <h1>冰島環島</h1>
    <p>最終確認版 · 11/9–11/20</p>
    <div class="countdown" id="countdown">出發倒數計算中…</div>
  </section>

  <section id="flights"><h2>航班</h2>
    <div class="card"><h3>去程 BA800</h3><p>11/9 10:50 抵達 KEF</p></div>
    <div class="card"><h3>回程 BA801</h3><p>11/20 11:45 從 KEF 起飛</p></div>
  </section>

  <section id="itinerary"><h2>每日行程</h2>
    <div class="day-switcher" id="day-buttons"></div>
    <div id="timeline" class="timeline"></div>
  </section>
</div>
<script>
function updateCountdown(){const target=new Date('2026-11-09T00:00:00');const daysLeft=Math.ceil((target-new Date())/86400000);document.getElementById('countdown').textContent=daysLeft>0?`出發倒數 ${daysLeft} 天`:(daysLeft===0?'今天出發！':'行程進行中或已結束');}
updateCountdown();
const days = [
  {date:'11/9', color:'#F2A497', title:'落地藍湖雷市', stay:{name:'Máni Apartments（雷市 Laugavegur）', note:'可煮但今晚唔洗煮', img:'images/stay-mani.jpg'}, items:[
    {time:'10:50', act:'KEF BA800 降落', tag:'act', must:true},
    {time:'12:00', act:'KEF 拎車', tag:'drive'},
    {time:'12:20–13:20', act:'Lunch KEF', tag:'eat'},
    {time:'14:00–16:00', act:'藍湖', tag:'act', must:true, img:'images/blue-lagoon.jpg'},
    {time:'17:00', act:'入住 Máni Apartments', tag:'act'},
    {time:'17:50–18:20', act:'Hallgrímskirkja（可選）', tag:'walk', must:true, note:'時間唔夠可改 11/19', img:'images/hallgrimskirkja.jpg?v=2'},
    {time:'18:25–18:40', act:'Harpa', tag:'walk', img:'images/harpa-concert.jpg?v=3'},
    {time:'18:45–18:55', act:'太陽航海者', img:'images/sun-voyager.jpg?v=4', tag:'walk'},
    {time:'17:15–18:00', act:'晚餐 Messinn', tag:'eat', note:'check-in 後直接去'},
    {time:'20:30–21:30', act:'極光備案 Grótta（可選）', img:'images/grotta.jpg?v=4', tag:'drive'}
  ]},
  {date:'11/10', color:'#F6D27A', title:'Geysir + Gullfoss → Hella', stay:{name:'Hótel Lækur（Hella）', note:'唔洗煮·要預訂晚餐', img:'images/stay-laekur.jpg'}, items:[
    {time:'07:45', act:'建議起身（雷市）', tag:'act', note:'準備出發'},
    {time:'08:30', act:'出發去 Geysir', tag:'drive', note:'約 1h15–20，日出微亮到達'},
    {time:'10:00–11:00', act:'Geysir', tag:'walk', must:true, img:'images/geysir.jpg'},
    {time:'11:15–12:20', act:'Gullfoss', tag:'walk', must:true, img:'images/gullfoss.jpg'},
    {time:'13:00–13:45', act:'Friðheimar（已訂 13:00）', img:'images/fridheimar.jpg?v=4', tag:'eat', note:'已預訂'},
    {time:'14:15–14:45', act:'Kerið（可選）', img:'images/kerid.jpg?v=4', tag:'walk'},
    {time:'15:15–16:00', act:'補給 Selfoss', tag:'drive'},
    {time:'16:45', act:'入住 Hótel Lækur', tag:'act'}
  ]},
  {date:'11/11', color:'#F6D27A', title:'南岸 Vík Chill（建議 07:00 起身）', stay:{name:'Black Beach Suites（Vík）', note:'要煮或入鎮食', img:'images/stay-black-beach.jpg'}, items:[
    {time:'10:00–10:45', act:'Seljalandsfoss', tag:'walk', must:true, img:'images/seljalandsfoss.jpg'},
    {time:'11:15–12:00', act:'Skógafoss', tag:'walk', must:true, img:'images/skogafoss.jpg'},
    {time:'11:00–12:00', act:'午餐 Vík', tag:'eat'},
    {time:'12:30–13:00', act:'補給 Krónan', tag:'drive'},
    {time:'13:15–13:45', act:'Dyrhólaey（可選）', img:'images/dyrholaey.jpg?v=4', tag:'walk'},
    {time:'14:00–14:45', act:'Reynisfjara', tag:'walk', must:true, img:'images/reynisfjara.jpg'},
    {time:'15:00', act:'入住 Black Beach Suites', tag:'act'}
  ]},
  {date:'11/12', color:'#B9DAA5', title:'藍冰洞 → Höfn（建議 07:30 起身）', stay:{name:'Erobik Apartments（Höfn）', note:'可煮也可出街食', img:'images/stay-erobik.jpg'}, items:[
    {time:'全程注意', act:'⚠ 收費 Hornafjörður', tag:'drive', toll:true},
    {time:'10:00–14:00', act:'藍冰洞團（建議升級 Extended）', img:'images/blue-ice-cave.jpg?v=4', tag:'act', must:true},
    {time:'14:30–15:30', act:'Jökulsárlón + Diamond Beach', tag:'walk', must:true, img:'images/jokulsarlon.jpg', img2:'images/diamond-beach-v2.jpg?v=4'},
    {time:'16:30–17:00', act:'補給 Nettó Höfn', tag:'drive'},
    {time:'17:30', act:'入住 Erobik Apartments', tag:'act'}
  ]},
  {date:'11/13', color:'#A8D3E6', title:'東部', stay:{name:'Eiðar Apartments', note:'要煮·鎮外唔餐廳', img:'images/stay-eidar.jpg'}, items:[
    {time:'10:00–10:30', act:'Djúpivogur 短停（可選）', img:'images/djupivogur.jpg?v=4', tag:'walk'},
    {time:'13:00–14:00', act:'Salt Café', tag:'eat'},
    {time:'14:00–14:45', act:'補給 Egilsstaðir（目標早到）', tag:'drive'},
    {time:'17:00', act:'入住 Eiðar Apartments', tag:'act'}
  ]},
  {date:'11/14', color:'#A8D3E6', title:'米湖（建議 08:00 起身）', stay:{name:'Berjaya Mývatn', note:'唔洗煮·未有酒店實圖'}, items:[
    {time:'10:30–11:15', act:'Dettifoss（11月高風險，多數放棄）', img:'images/dettifoss.jpg?v=4', tag:'walk'},
    {time:'11:30–12:15', act:'Hverir', tag:'walk', must:true, img:'images/hverir-namafjall.jpg?v=3'},
    {time:'12:30–13:15', act:'Dimmuborgir', img:'images/dimmuborgir.jpg?v=4', tag:'walk'},
    {time:'14:00–16:00', act:'米湖溫泉', img:'images/myvatn-baths.jpg?v=4', tag:'act', must:true},
    {time:'16:30–18:00', act:'Vogafjós', tag:'eat'},
    {time:'18:30', act:'入住 Berjaya Mývatn', tag:'act'}
  ]},
  {date:'11/15', color:'#F2A497', title:'Goðafoss → Laugarbakki（建議 07:30 起身）', stay:{name:'Hótel Laugarbakki', note:'唔洗煮·食酒店·未有酒店實圖'}, items:[
    {time:'全程注意', act:'⚠ 收費隧道 Vaðlaheiðargöng', tag:'drive', toll:true},
    {time:'09:30–10:15', act:'Goðafoss', tag:'walk', must:true, img:'images/godafoss.jpg'},
    {time:'11:30–12:30', act:'阿克雷里鎮內短行', img:'images/akureyri.jpg?v=4', tag:'walk'},
    {time:'12:00–13:30', act:'Lunch 阿克雷里 + 補給', tag:'eat'},
    {time:'16:30', act:'入住 Hótel Laugarbakki', tag:'act'}
  ]},
  {date:'11/16', color:'#F2A497', title:'斯奈山 Day 1（建議 08:30 出發）', stay:{name:'Kirkjufell central apartment', note:'可煮·兩晚，住到 11/17·未有公寓實圖'}, items:[
    {time:'08:30', act:'由 Laugarbakki 出發', tag:'drive', note:'約 2.5 小時'},
    {time:'11:30', act:'入住 Kirkjufell apartment', tag:'act'},
    {time:'12:00–12:40', act:'Grundarfjörður 短行（可選）', tag:'walk'},
    {time:'13:30–15:30', act:'Kirkjufell + Kirkjufellsfoss', tag:'walk', must:true, img:'images/kirkjufell.jpg'},
    {time:'18:30', act:'Bjargarsteinn', tag:'eat'}
  ]},
  {date:'11/17', color:'#F2A497', title:'斯奈山西／南岸（建議 09:00 出發）', stay:{name:'Kirkjufell central apartment', note:'第二晚·可煮·未有公寓實圖'}, items:[
    {time:'09:00', act:'由酒店出發', tag:'drive'},
    {time:'09:30–10:00', act:'Ingjaldshóll Church（可選）', tag:'walk', img:'images/ingjaldsholl.jpg'},
    {time:'10:15–10:45', act:'Saxhóll', img:'images/saxholl.jpg?v=4', tag:'walk'},
    {time:'11:00–11:45', act:'Djúpalónssandur（可選）', tag:'walk', img:'images/djupalonssandur.jpg'},
    {time:'12:00–13:00', act:'Arnarstapi / Hellnar 步道', img:'images/arnarstapi.jpg?v=4', tag:'walk'},
    {time:'18:00', act:'自己煮晚餐', tag:'eat'}
  ]},
  {date:'11/18', color:'#FFFCF6', title:'Borgarnes（建議 10:30 退房出發）', stay:{name:'Hótel Vesturland（Borgarnes）', note:'唔洗煮·未有酒店實圖'}, items:[
    {time:'10:30', act:'退房出發', tag:'drive'},
    {time:'11:00–11:30', act:'Ytri Tunga 海豹沙灘', img:'images/ytri-tunga.jpg?v=4', tag:'walk'},
    {time:'11:45–12:05', act:'Búðakirkja', img:'images/budakirkja.jpg?v=4', tag:'walk'},
    {time:'12:30', act:'入住 Hótel Vesturland', tag:'act'},
    {time:'14:00–15:30', act:'Settlement Center（可選）', tag:'walk', img:'images/settlement-center.jpg'},
    {time:'15:00–16:30', act:'Hraunfossar + Barnafoss（可選）', tag:'walk', note:'約 40–50 分鐘車程', img:'images/hraunfossar.jpg'},
  ]},
  {date:'11/19', color:'#c8e8d4', title:'Þingvellir → 雷市', stay:{name:'Stay Apartments（雷市）', note:'可煮', img:'images/stay-stay.jpg'}, items:[
    {time:'08:30', act:'由 Borgarnes 出發', tag:'drive'},
    {time:'10:15–11:30', act:'Þingvellir', tag:'walk', must:true, img:'images/thingvellir.jpg', note:'由 Borgarnes 約 70 分鐘'},
    {time:'12:30', act:'入住 Stay Apartments', tag:'act'},
    {time:'14:00–15:30', act:'Hallgrímskirkja（可補）', tag:'walk', img:'images/hallgrimskirkja.jpg?v=2'},
    {time:'16:00–17:30', act:'雷市逛街／購物', tag:'act'},
    {time:'15:00–16:00', act:'陰茎博物館（可選）', tag:'walk', img:'images/phallological-museum.jpg'},
    {time:'20:00', act:'Sky Lagoon（可選）', tag:'act', img:'images/sky-lagoon.jpg'}
  ]},
  {date:'11/20', color:'#D4E8C8', title:'還車離境（建議 07:00 起身）', items:[
    {time:'09:30', act:'KEF 還車', tag:'drive'},
    {time:'11:45', act:'BA801 起飛', tag:'act', must:true}
  ]}
];
const buttons=document.getElementById('day-buttons');const timeline=document.getElementById('timeline');
days.forEach((d,i)=>{const btn=document.createElement('button');btn.className='day-btn'+(i===0?' active':'');btn.style.background=d.color;btn.style.color='#3E3A39';btn.textContent=d.date;btn.onclick=()=>selectDay(i);buttons.appendChild(btn);});
function selectDay(idx){document.querySelectorAll('.day-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));renderTimeline(idx);}
function renderTimeline(idx){const d=days[idx];timeline.innerHTML=`<h3>${d.date} ${d.title}</h3>`;d.items.forEach(item=>{const div=document.createElement('div');div.className='item';const tagClass=item.tag==='drive'?'tag-drive':item.tag==='walk'?'tag-walk':item.tag==='eat'?'tag-eat':'tag-act';const tagText=item.tag==='drive'?'自駕':item.tag==='walk'?'步行':item.tag==='eat'?'用餐':'活動';let html=`<strong>${item.time}</strong> ${item.act} <span class="tag ${tagClass}">${tagText}</span>`;if(item.must)html+='<span class="must">必去</span>';if(item.toll)html+='<span class="toll">收費注意</span>';if(item.note)html+=`<span class="note">${item.note}</span>`;if(item.img)html+=`<br><img class="spot-img" src="${item.img}" alt="${item.act}"><div class="cap">${item.act}</div>`;
if(item.img2)html+=`<br><img class="spot-img" src="${item.img2}" alt=""><div class="cap">Diamond Beach</div>`;div.innerHTML=html;timeline.appendChild(div);});if(d.stay){const box=document.createElement('div');box.className='stay-box';box.innerHTML=`<strong>今晚住宿</strong><h3>${d.stay.name}</h3><p>${d.stay.note}</p>`+(d.stay.img?`<img class="stay-img" src="${d.stay.img}" alt="">`:'');timeline.appendChild(box);}}
selectDay(0);
</script>
</body>
</html>
